plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.synervoz.switchboardandroiddemo'
    compileSdk 36

    defaultConfig {
        applicationId "com.synervoz.switchboardandroiddemo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true // Required by SwitchboardWhisper extension
        }
    }
}

dependencies {

//    Switchboard SDK and Extensions
    implementation 'com.synervoz.switchboard:switchboardsdk:3.2.6'
    implementation 'com.synervoz.switchboard.extensions:whisper:3.2.6'
    implementation 'com.synervoz.switchboard.extensions:silerovad:3.2.6'
    implementation 'com.synervoz.switchboard.extensions:onnx:3.2.6'
    implementation 'com.synervoz.switchboard.extensions:sherpa:3.2.6'

//    Switchboard SDK and Extensions from local AAR files
//    implementation fileTree(dir: '../libs', include: ['*.aar'])
//    implementation files('../libs/SwitchboardSDK.aar')
//    implementation files('../libs/SwitchboardWhisper.aar')
//    implementation files('../libs/SwitchboardSileroVAD.aar')
//    implementation files('../libs/SwitchboardOnnx.aar')
//    implementation files('../libs/SwitchboardSherpa.aar')

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
